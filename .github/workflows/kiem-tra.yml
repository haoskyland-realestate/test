# Tự kiểm mọi tính năng trên máy Ubuntu VÀ Windows của GitHub mỗi lần đẩy mã: bắt lỗi chỉ có trên Windows (đường dẫn, UTF-8, npx.cmd…)
# trước khi tới PC của Hào. Repo công khai: máy GitHub miễn phí. Chạy tay: tab Actions → Kiểm tra → Run workflow.
name: Kiểm tra
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tu-kiem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: { run: { working-directory: video-studio, shell: bash } }
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cài FFmpeg
        run: |
          if [ "$RUNNER_OS" = Windows ]; then choco install -y --no-progress ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - run: npm install --no-audit --no-fund
      - name: Cài thư viện Python (giống setup-windows.ps1)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy faster-whisper "opencv-python-headless<5" opentimelineio otio-fcp-adapter onnxruntime yt-dlp playwright
          python -m playwright install chromium
      - name: Tự kiểm mọi tính năng + dựng thử 6 giây
        run: python scripts/kiem_may.py --tu-kiem --dung-thu
