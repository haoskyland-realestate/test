<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hào Sky Land Studio</title>
<style>
  :root { --bg:#0b0d10; --panel:#14171c; --card:#1b1f26; --line:#262b33; --text:#e9ebee; --dim:#8a919b; --lime:#e9f86b; --gold:#d4a64a; --err:#f2766b; --ok:#7bd88f;
    --c-text:#9a8a2e; --c-sub:#2c3440; --c-card:#6b2140; --c-broll:#1f4f5a; --c-zoom:#24325a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button, select, input, textarea { font:inherit; color:var(--text); background:#0f1216; border:1px solid var(--line); border-radius:10px; padding:7px 11px; }
  button { cursor:pointer; background:var(--card); border-color:transparent; }
  button:hover { border-color:#3a414c; } button:disabled { opacity:.45; cursor:default; }
  button.lime { background:var(--lime); color:#111; font-weight:700; }
  button.ghost { background:transparent; }
  .dim { color:var(--dim); } .err { color:var(--err); } .ok { color:var(--ok); }
  #app { display:grid; height:100vh; grid-template-rows:auto auto minmax(0,1fr) auto; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px 4px; flex-wrap:wrap; }
  #title { flex:1; min-width:240px; }
  #title select { font-size:20px; font-weight:800; background:transparent; border:0; padding:0 4px 0 0; }
  #title .dot { display:inline-block; width:10px; height:10px; border-radius:3px; background:var(--lime); margin-right:8px; }
  #stat { font-size:12px; } #stat b { color:var(--lime); font-weight:600; }
  .grp { display:flex; gap:4px; background:var(--panel); border-radius:12px; padding:4px; }
  .grp button { padding:6px 9px; background:transparent; }
  #tabs { display:flex; gap:6px; padding:6px 16px 10px; overflow-x:auto; border-bottom:1px solid var(--line); }
  #tabs button { background:transparent; white-space:nowrap; font-size:15px; }
  #tabs button .n { display:inline-block; min-width:20px; margin-left:6px; padding:0 6px; border-radius:7px; background:#262b33; font-size:11px; }
  #tabs button.on { background:var(--panel); color:var(--lime); } #tabs button.on .n { background:var(--lime); color:#111; }
  main { display:grid; grid-template-columns:minmax(300px,1fr) minmax(320px,1.6fr) minmax(280px,1fr); gap:12px; padding:12px 16px; min-height:0; }
  main.yt { grid-template-columns:minmax(440px,1.7fr) minmax(320px,1.2fr) minmax(280px,1fr); }
  main.noL { grid-template-columns:0 minmax(320px,2fr) minmax(280px,1fr); } main.noL #left { display:none; }
  main.noR { grid-template-columns:minmax(300px,1fr) minmax(320px,2fr) 0; } main.noR #right { display:none; }
  main.noL.noR { grid-template-columns:0 1fr 0; }
  .box { background:var(--panel); border-radius:16px; padding:14px; min-height:0; overflow:auto; }
  #left { display:flex; flex-direction:column; align-items:center; gap:10px; }
  #stage { position:relative; height:100%; max-height:calc(100% - 50px); aspect-ratio:9/16; background:#000; border-radius:12px; overflow:hidden; flex:1; }
  #stage.yt { aspect-ratio:16/9; height:auto; width:100%; flex:none; }
  #stage.yt #ovl .blk { left:4.8%; right:auto; width:53%; bottom:11%; } #stage.yt #ovl .sub { top:auto; bottom:6.5%; left:5%; right:5%; }
  #stage.yt #ovl .card { justify-content:center; padding:0 22%; }
  #stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center; }
  #pb { display:none; } #out { display:none; object-fit:contain !important; }
  #ovl { position:absolute; inset:0; pointer-events:none; container-type:size; }
  #ovl .blk { position:absolute; left:6.7%; right:13%; bottom:23%; font-weight:700; text-shadow:0 2px 8px #000; }
  #ovl .l { font-size:3.2cqh; line-height:1.15; } #ovl .big { font-size:4.4cqh; } #ovl .hl { color:#f2c766; }
  #ovl .tag { display:inline-block; font-size:1.5cqh; border:1px solid var(--gold); color:#f2c766; border-radius:2cqh; padding:.3cqh 1cqh; margin-bottom:1cqh; }
  #ovl .num { font-size:9cqh; line-height:.9; color:transparent; -webkit-text-stroke:1px #f2c766; }
  #ovl .sub { position:absolute; left:8%; right:8%; top:61.5%; text-align:center; } #ovl .sub > span { display:inline-block; background:#0b1b2b99; border-radius:1cqh; padding:.5cqh 1.2cqh; font-weight:800; font-size:3.1cqh; line-height:1.35; }
  #ovl .sub .hl { display:inline-block; color:#14110a; background:#f2c766; font-size:1.2em; padding:0 .6cqh; border-radius:.6cqh; margin:0 .15cqh; }
  #ovl .card { position:absolute; inset:0; background:#0b1b2b; display:flex; flex-direction:column; justify-content:flex-start; padding:17.7% 12% 0; }
  #ovl .card .cs { text-align:center; font-size:1.6cqh; letter-spacing:.4cqh; color:#f2c766; text-transform:uppercase; }
  #ovl .card .ct { text-align:center; font-size:4.8cqh; font-weight:800; color:#f2c766; text-transform:uppercase; margin:.5cqh 0 2.5cqh; line-height:1.05; }
  #ovl .card .ci { background:#ffffff10; border-radius:1cqh; padding:1.1cqh 1.4cqh; margin-top:1cqh; font-size:2.3cqh; }
  #ovl .safe { position:absolute; border:1px dashed #ff5a5acc; background:#ff5a5a14; }
  #msgStage { position:absolute; left:0; right:0; top:45%; text-align:center; color:var(--dim); padding:0 10px; }
  #ctrl { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #ctrl .time { font-variant-numeric:tabular-nums; color:var(--dim); }
  #mid { display:flex; flex-direction:column; gap:10px; }
  #midTop { display:flex; gap:8px; align-items:center; } #midTop .desc { flex:1; color:var(--dim); }
  #list { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
  .it { background:var(--card); border-radius:12px; padding:10px; cursor:pointer; border:1px solid transparent; }
  .it.sel { border-color:var(--lime); } .it .h { font-weight:700; } .it .m { color:var(--dim); font-size:12px; }
  #right h3 { margin:0 0 4px; font-size:18px; text-transform:uppercase; letter-spacing:.5px; }
  #right label { display:block; margin:10px 0 4px; color:var(--dim); font-size:12px; }
  #right input, #right select, #right textarea { width:100%; } #right textarea { min-height:80px; }
  .note { background:var(--card); border-radius:12px; padding:12px; margin-top:12px; font-size:13px; color:#cfd3d8; }
  .note b { color:var(--lime); font-size:11px; letter-spacing:1px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  #tl { border-top:1px solid var(--line); background:var(--panel); }
  #tlbar { display:flex; align-items:center; gap:10px; padding:8px 16px; }
  #tlbar .tc { flex:1; text-align:center; font-variant-numeric:tabular-nums; }
  #tlwrap { display:grid; grid-template-columns:110px 1fr; max-height:38vh; overflow:auto; }
  #labels div { height:34px; display:flex; align-items:center; gap:6px; padding-left:16px; color:var(--dim); font-size:13px; }
  #labels .rl { height:24px; } #labels .vid { height:52px; } #labels .on { color:var(--lime); }
  #scroll { overflow-x:auto; position:relative; }
  #track { position:relative; }
  .ruler { position:relative; height:24px; cursor:pointer; border-bottom:1px solid var(--line); }
  .ruler span { position:absolute; top:4px; font-size:11px; color:var(--dim); transform:translateX(-50%); }
  .ruler i { position:absolute; bottom:0; width:1px; height:5px; background:#3a414c; }
  .ln { position:relative; height:34px; } .ln.vid { height:52px; }
  .x { position:absolute; top:4px; bottom:4px; border-radius:8px; padding:0 8px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:grab; display:flex; align-items:center; border:1.5px solid transparent; touch-action:none; user-select:none; }
  .x.sel { border-color:var(--lime); } .x .rz { position:absolute; right:0; top:0; bottom:0; width:8px; cursor:ew-resize; }
  .x.text { background:var(--c-text); color:#fff7c8; } .x.sub { background:var(--c-sub); } .x.card { background:var(--c-card); } .x.broll { background:var(--c-broll); } .x.zoom { background:var(--c-zoom); }
  .x.clip { background:#202833 repeat-x left center/auto 100%; align-items:flex-start; padding-top:3px; text-shadow:0 1px 3px #000; cursor:pointer; }
  .x.clip .d { position:absolute; right:6px; bottom:4px; background:#000a; border-radius:5px; padding:0 5px; font-size:11px; }
  .x.tr { top:14px; bottom:14px; width:22px !important; padding:0; justify-content:center; background:#3a2f17; color:#f2d08a; z-index:2; cursor:pointer; }
  .x.wave { background:#141b24 no-repeat center/100% 100%; cursor:default; }
  #ph { position:absolute; top:0; bottom:0; width:2px; background:#fff; z-index:5; pointer-events:none; }
  #ph::before { content:""; position:absolute; top:0; left:-7px; width:16px; height:18px; border-radius:4px; background:#fff; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:16px; max-width:720px; width:92vw; }
  dialog::backdrop { background:#000a; }
  @media (max-width:900px) {
    #app { height:auto; } main, main.noL, main.noR { grid-template-columns:1fr; }
    #stage { height:56vh; max-height:none; flex:none; } #tlwrap { max-height:none; }
  }
  dialog a { color: var(--lime); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="title"><span class="dot"></span><select id="proj" aria-label="Dự án"></select><button class="ghost" id="newP" title="Dự án mới / nhân bản sang khung khác">＋</button><div id="stat" class="dim"></div></div>
    <div class="grp" aria-label="Bố cục">
      <button id="lyL" title="Ẩn/hiện khung xem">◧</button><button id="lyR" title="Ẩn/hiện khung chỉnh">◨</button>
      <button id="lyT" title="Ẩn/hiện timeline">⬓</button><button id="lyF" title="Toàn màn hình">⛶</button>
    </div>
    <button class="ghost" id="undo" title="Hoàn tác (Ctrl+Z)">↶</button><button class="ghost" id="redo" title="Làm lại (Ctrl+Shift+Z)">↷</button>
    <button id="btnLib">▦ Thư viện</button><button class="ghost" id="btnHist">Lịch sử</button><button class="ghost" id="btnAI">Nhờ AI sửa</button>
    <button class="ghost" id="save">Lưu</button><button id="draft">Dựng nháp</button><button class="lime" id="export">Xuất video</button><button class="ghost" id="nle" title="Xuất timeline để dựng tiếp trên Premiere Pro hoặc DaVinci Resolve">Premiere/DaVinci</button>
  </header>
  <nav id="tabs" aria-label="Nhóm chỉnh sửa"></nav>
  <main id="main">
    <section class="box" id="left">
      <div id="stage">
        <video id="pv" playsinline preload="auto"></video><video id="pb" playsinline muted preload="auto"></video><video id="out" controls playsinline></video>
        <div id="ovl"></div><div id="msgStage"></div>
      </div>
      <div id="ctrl">
        <button class="ghost" id="back">−1s</button><button class="lime" id="play">Phát</button><button class="ghost" id="fwd">+1s</button>
        <span class="time" id="ptime">0:00.0 / 0:00.0</span>
        <label class="dim"><input type="checkbox" id="safe" checked> Vùng an toàn</label>
        <select id="viewSel" aria-label="Xem"><option value="edit">Xem trước</option><option value="nhap">Bản nháp</option><option value="xuat">Bản xuất</option></select>
      </div>
    </section>
    <section class="box" id="mid">
      <div id="midTop"><span class="desc" id="desc"></span><input id="search" placeholder="Tìm…" style="max-width:200px"><button id="add">Thêm</button></div>
      <div id="list"></div>
    </section>
    <aside class="box" id="right"></aside>
  </main>
  <section id="tl">
    <div id="tlbar">
      <button class="ghost" id="split" title="Tách tại kim chạy (S)">✂ Tách</button><button class="ghost" id="del" title="Xóa (Delete)">🗑 Xóa</button>
      <div class="tc" id="tc"></div>
      <button class="ghost" id="zout">−</button><input id="zoom" type="range" min="10" max="200" value="45" aria-label="Thu phóng"><button class="ghost" id="zin">+</button>
      <button class="ghost" id="fit">Vừa khung</button>
    </div>
    <div id="tlwrap"><div id="labels"></div><div id="scroll"><div id="track"></div></div></div>
  </section>
</div>
<dialog id="dlg"><div id="dlgBody"></div><div class="row" style="justify-content:flex-end"><button onclick="dlg.close()">Đóng</button></div></dialog>
<script>
const T = new URLSearchParams(location.search).get("t") || "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = s => esc(s).replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>');
const fmt = t => { t = Math.max(0, t); return `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`; };
const FPS = 30, TIMED = ["texts", "subtitles", "cards", "zooms", "broll"];
let files = [], FX, name, tl, sel = null, undoS = [], redoS = [], uid = 0, dirty = false, now = 0, playing = false, last = 0, tab = "texts", poll;

// Tab: khóa dữ liệu, tên, mô tả
const TABS = [
  ["texts", "Chữ", "Khối chữ động: mở đầu, mục số, câu lớn, số liệu, danh sách…"],
  ["subtitles", "Phụ đề", "Phụ đề theo lời nói. Có thể dán nội dung file SRT."],
  ["clips", "Cắt", "Các đoạn video chính, theo thứ tự. Tách, đổi chỗ, chỉnh đoạn cắt."],
  ["zooms", "Zoom", "Phóng to khung trong một đoạn để nhấn ý (7% = 1.07)."],
  ["cards", "Minh hoạ", "Cảnh nền đen diễn giải ý đang nói — mỗi cảnh một ý."],
  ["broll", "Cảnh trám", "Phủ cảnh khác lên video chính, vẫn giữ tiếng nói."],
  ["audio", "Âm thanh", "Giọng gốc, nhạc nền, tiếng chuyển cảnh."],
  ["frame", "Khung hình", "TikTok dọc 9:16 hoặc YouTube ngang 16:9, và vùng an toàn."],
  ["brand", "Thương hiệu", "Phong cách: màu, chữ, nhịp chuyển động."],
];
const LANES = [["texts", "T  Chữ"], ["subtitles", "▭  Phụ đề"], ["cards", "▣  Minh hoạ"], ["broll", "▤  Cảnh trám"], ["zooms", "⌕  Zoom"], ["clips", "▶  Video"], ["voice", "∿  Giọng nói"]];
const ARR = ["lines", "items"], OPT = {outro: ["note"], lower: ["sub"], quote: ["by"], checklist: ["title"], stat: ["prefix", "suffix", "decimals"]};
const LBL = {file: "Tên file", id: "ID Google Drive", tag: "Thẻ nhãn", num: "Số mục", title: "Tiêu đề", sub: "Dòng phụ", by: "Người nói", note: "Ghi chú nhỏ", text: "Nội dung",
  value: "Giá trị số", label: "Nhãn dưới số", prefix: "Chữ trước số", suffix: "Chữ sau số", decimals: "Số chữ số thập phân", step: "Nhãn bước (vd: Bước 2)",
  lines: "Các dòng (mỗi dòng một hàng, *từ* để tô màu)", items: "Các mục (mỗi mục một hàng)", in: "Bắt đầu từ giây (trong file gốc)", start: "Bắt đầu (giây trên video)", dur: "Độ dài (giây)", scale: "Mức phóng (1.07 = 7%)"};

async function api(path, opt = {}) {
  const r = await fetch("/api/" + path, {...opt, headers: {"X-Token": T, "Content-Type": "application/json"}});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || (j.errors || []).join("; ") || r.status), {data: j});
  return j;
}
const P = () => `p/${encodeURIComponent(name)}`;
const media = (kind, spec) => `/api/${P()}/${kind}/${encodeURIComponent(spec)}?t=${T}`;
let toastT; function toast(t, cls = "") { $("#stat").innerHTML = `<span class="${cls}">${t}</span>`; clearTimeout(toastT); toastT = setTimeout(stat, 4000); }

// Cùng công thức với scripts/timeline.py
function layout(t = tl) {
  const starts = [], trs = []; let x = 0;
  t.clips.forEach((c, i) => {
    starts.push(x); x += +c.dur;
    if (i < t.clips.length - 1) { const tr = t.transitions[i], d = tr.type === "cut" ? 0 : +(tr.dur ?? FX.transitions[tr.type].dur); trs.push([x, d]); x += d; }
  });
  return {starts, trs, total: x};
}
const clean = t => JSON.parse(JSON.stringify(t, (k, v) => k.startsWith("_") ? undefined : v));

// Mọi thay đổi đi qua đây: lưu để hoàn tác, giữ các mục theo thời gian bám theo đoạn video khi đoạn đổi độ dài/thứ tự.
function mutate(fn) {
  undoS.push(JSON.stringify(tl)); if (undoS.length > 150) undoS.shift(); redoS = [];
  const L0 = layout();
  for (const k of TIMED) for (const x of tl[k] || []) {
    let c = 0; L0.starts.forEach((s, i) => { if (x.start >= s - 1e-6) c = i; });
    x._a = {id: tl.clips[c]._id, off: x.start - L0.starts[c], s0: x.start};
  }
  fn();
  const L1 = layout();
  for (const k of TIMED) for (const x of tl[k] || []) {
    // mục vừa được dời tay (kéo, gõ giờ) giữ vị trí mới; mục khác bám theo đoạn video của nó
    if (x._a && x.start === x._a.s0) { const c = tl.clips.findIndex(c => c._id === x._a.id); if (c >= 0) x.start = L1.starts[c] + x._a.off; }
    delete x._a;
    x.start = +Math.max(0, Math.min(x.start, L1.total - 0.2)).toFixed(2);
    x.dur = +Math.max(0.2, Math.min(x.dur, L1.total - x.start)).toFixed(2);
  }
  dirty = true; now = Math.min(now, L1.total); draw();
}
function setRaw(s) { tl = JSON.parse(s); tl.clips.forEach(c => c._id ??= ++uid); sel = null; dirty = true; draw(); }
function undo() { if (!undoS.length) return toast("Không còn gì để hoàn tác"); redoS.push(JSON.stringify(tl)); setRaw(undoS.pop()); }
function redo() { if (!redoS.length) return toast("Không còn gì để làm lại"); undoS.push(JSON.stringify(tl)); setRaw(redoS.pop()); }

function stat() {
  const L = layout(), c = k => (tl[k] || []).length;
  $("#stat").innerHTML = `<b>Dự án</b> · ${fmt(L.total)} · ${c("clips")} đoạn cắt · ${c("texts")} khối chữ · ${c("subtitles")} phụ đề · ${c("cards")} minh hoạ · ${c("broll")} cảnh trám · `
    + (dirty ? `<b>Chưa lưu</b>` : `<span class="ok">Đã lưu</span>`) + ` · ${esc(FX.styles[tl.meta.style || "hien-dai"].split(":")[0])}`;
}

function draw() { const yt = tl.meta.platform === "youtube"; $("#stage").classList.toggle("yt", yt); $("#main").classList.toggle("yt", yt); stat(); drawTabs(); drawList(); inspector(); drawTimeline(); renderFrame(); }
function drawTabs() {
  $("#tabs").innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${n}${Array.isArray(tl[k]) ? `<span class="n">${tl[k].length}</span>` : ""}</button>`).join("");
  $("#desc").textContent = TABS.find(x => x[0] === tab)[2];
  const listy = Array.isArray(tl[tab]);
  $("#add").hidden = !listy || tab === "clips"; $("#search").hidden = !listy;
}
function itemLabel(k, x) {
  if (k === "texts") return x.title || x.text || (x.lines || x.items || [""])[0] || x.label || x.kind;
  if (k === "subtitles") return x.text; if (k === "cards") return x.title; if (k === "zooms") return `Zoom ${Math.round((x.scale - 1) * 100)}%`;
  return x.file || "";
}
function drawList() {
  const box = $("#list");
  if (!Array.isArray(tl[tab])) return box.innerHTML = settings();
  const q = $("#search").value.toLowerCase(), L = layout();
  box.innerHTML = tl[tab].map((x, i) => {
    const lab = String(itemLabel(tab, x)).replace(/\*/g, "");
    if (q && !lab.toLowerCase().includes(q)) return "";
    const t0 = tab === "clips" ? L.starts[i] : x.start;
    const pic = tab === "clips" || tab === "broll" ? `<div style="height:90px;border-radius:8px;margin-bottom:8px;background:#222 center/cover url('${media("thumb", x.file + "@" + (+x.in + 0.3).toFixed(1))}')"></div>` : "";
    return `<div class="it${sel && sel.k === tab && sel.i === i ? " sel" : ""}" data-k="${tab}" data-i="${i}">${pic}<div class="h">${i + 1}. ${esc(lab)}</div><div class="m">${fmt(t0)} · ${(+x.dur).toFixed(1)}s${x.kind ? " · " + x.kind : ""}</div></div>`;

function drawTimeline() {
  const L = layout(), pps = +$("#zoom").value, W = Math.ceil(L.total * pps) + 80;

  for (let s = 0; s <= L.total + 0.01; s += step) h += `<span style="left:${s * pps}px">${fmt(s).replace(/\.\d$/, "")}</span><i style="left:${s * pps}px"></i>`;
  h += `</div>`;
  const it = (k, i, x0, d, cls, label, extra = "") => `<div class="x ${cls}${sel && sel.k === k && sel.i === i ? " sel" : ""}" data-k="${k}" data-i="${i}" style="left:${x0 * pps}px;width:${Math.max(d * pps, 6)}px;${extra}">${label}${TIMED.includes(k) ? '<span class="rz"></span>' : ""}</div>`;

    if (lanes[k]) (tl[k] || []).forEach((x, i) => h += it(k, i, x.start, x.dur, lanes[k], (k === "texts" ? "T  " : k === "cards" ? "▣  " : k === "zooms" ? "⌕  " : "") + esc(String(itemLabel(k, x)).replace(/\*/g, ""))));
    if (k === "clips") {

    }

function placePH() {

// ---- Trình phát: phát bản xem trước nhẹ của footage theo một đồng hồ chung, chữ vẽ đè lên ----
let proxyReady = {};  // theo dự án đang mở: mở dự án khác thì làm lại
function ensureProxy(f) {
  if (proxyReady[f] === true) return true;
  if (proxyReady[f]) return false;  // đang chờ hoặc lỗi
  proxyReady[f] = "wait";
  const tick = async () => {
    const r = await api(`${P()}/proxy/${encodeURIComponent(f)}?check=1`).catch(() => ({failed: true}));
    if (r.ready) { proxyReady[f] = true; renderFrame(); } else if (r.failed) { proxyReady[f] = "fail"; renderFrame(); } else setTimeout(tick, 2500);
  };
  tick(); return false;
}
function syncVideo(v, file, t, muted) {
  if (v.dataset.f !== file) { v.dataset.f = file; v.src = media("proxy", file); }
  v.muted = muted;
  if (v.readyState >= 1 && Math.abs(v.currentTime - t) > (playing ? 0.3 : 0.04)) v.currentTime = t;
  if (playing && v.paused) v.play().catch(() => {}); if (!playing && !v.paused) v.pause();
}
function at(t) {
  const L = layout(); let ci = 0;
  L.starts.forEach((s, i) => { if (t >= s - 1e-6) ci = i; });
  return {ci, off: Math.max(0, Math.min(t - L.starts[ci], tl.clips[ci].dur - 0.04))};
}
function renderFrame() {
  placePH();
  if ($("#viewSel").value !== "edit") return;
  const {ci, off} = at(now), c = tl.clips[ci], pv = $("#pv"), pb = $("#pb");
  const ok = ensureProxy(c.file);
  $("#msgStage").textContent = ok ? "" : proxyReady[c.file] === "fail" ? `Chưa có footage ${c.file} trên máy` : `Đang tạo bản xem trước ${c.file}…`;
  if (ok) syncVideo(pv, c.file, +c.in + off, !(tl.audio || {}).voice);
  pv.style.visibility = ok ? "visible" : "hidden";
  const fit = c.fit || (tl.meta.platform === "youtube" && pv.videoHeight > pv.videoWidth ? "blur" : "crop");
  pv.style.objectFit = fit === "blur" ? "contain" : "cover";  // xem trước: nền mờ chỉ có ở bản dựng
  const on = k => (tl[k] || []).filter(x => now >= x.start && now < x.start + x.dur);
  const z = on("zooms")[0]; pv.style.transform = z ? `scale(${z.scale})` : "";
  const lk = FX.looks[c.look || FX.style_looks[tl.meta.style || "hien-dai"]]; pv.style.filter = lk ? lk.css : "";  // filter màu gần giống bản xuất
  const b = on("broll")[0];
  if (b && ensureProxy(b.file)) { pb.style.display = "block"; syncVideo(pb, b.file, +b.in + now - b.start, true); }
  else { pb.style.display = "none"; if (!pb.paused) pb.pause(); }
  let h = "";
  for (const x of on("texts")) {
    h += `<div class="blk">` + (x.tag ? `<div class="tag">${esc(x.tag)}</div>` : "") + (x.num ? `<div class="num">${esc(x.num)}</div>` : "")
      + (x.title ? `<div class="l">${hl(x.title)}</div>` : "") + (x.kind === "stat" ? `<div class="num">${esc(x.prefix || "")}${Number(x.value).toLocaleString("vi-VN")}${esc(x.suffix || "")}</div>` : "")
      + (x.lines || x.items || []).map(l => `<div class="l ${x.kind === "hook" ? "big" : ""}">${x.items ? "✓ " : ""}${hl(l)}</div>`).join("")
      + (x.text ? `<div class="l" style="font-size:2cqh">${esc(x.text)}</div>` : "") + (x.label ? `<div class="l">${hl(x.label)}</div>` : "")
      + (x.sub ? `<div class="l" style="font-weight:400">${esc(x.sub)}</div>` : "") + `</div>`;
  }
  for (const x of on("subtitles")) h += `<div class="sub"><span>${hl(x.text)}</span></div>`;
  for (const x of on("cards")) h += `<div class="card"><div class="cs">${esc(x.step || "")}</div><div class="ct">${esc(x.title)}</div>${(x.items || []).map((it, k) => `<div class="ci">${k + 1}. ${hl(it)}</div>`).join("")}</div>`;
  if ($("#safe").checked) h += tl.meta.platform === "youtube" ? `<div class="safe" style="inset:5%;background:none"></div>`
    : `<div class="safe" style="left:0;right:0;top:0;height:11.5%"></div><div class="safe" style="left:0;right:0;bottom:0;height:21.9%"></div><div class="safe" style="right:0;top:11.5%;bottom:21.9%;width:13%"></div>`;
  $("#ovl").innerHTML = h;
}
function loop(ts) {

});
function action(a) {
  if (!sel) return toast("Chọn một mục trước", "err");
  const {k, i} = sel, C = tl.clips, R = tl.transitions;
  if (a === "del" && k === "clips" && C.length < 2) return toast("Phải còn ít nhất một đoạn", "err");
  if (a === "del" && k === "transitions") return toast("Đổi chuyển cảnh thành “cut” để bỏ", "err");
  mutate(() => {
    if (a === "del" && k === "clips") { C.splice(i, 1); R.splice(Math.min(i, R.length - 1), 1); sel = null; }
    else if (a === "del") { tl[k].splice(i, 1); sel = null; }
    if (a === "dup") { C.splice(i + 1, 0, {...C[i], _id: ++uid}); R.splice(i, 0, {type: "cut"}); }
    if (a === "dupx") tl[k].splice(i + 1, 0, JSON.parse(JSON.stringify(tl[k][i])));

    if (a === "right" && i < C.length - 1) { [C[i + 1], C[i]] = [C[i], C[i + 1]]; sel.i++; }
    if (a === "split") splitAt(k, i);
  });
}
// Tách tại kim chạy: mục đang chọn (chữ, phụ đề…) hoặc đoạn video dưới kim
function splitAt(k, i) {
  if (!TIMED.includes(k)) {
    const {ci, off} = at(now), c = tl.clips[ci];
    if (off < 0.2 || c.dur - off < 0.2) return toast("Kim chạy quá sát mép đoạn, không tách được", "err");
    const b = {...c, _id: ++uid, in: +(c.in + off).toFixed(2), dur: +(c.dur - off).toFixed(2)}; c.dur = +off.toFixed(2);
    tl.clips.splice(ci + 1, 0, b); tl.transitions.splice(ci, 0, {type: "cut"}); return;
  }
  const x = tl[k][i], off = now - x.start;
  if (off < 0.2 || x.dur - off < 0.2) return toast("Đặt kim chạy vào giữa mục cần tách", "err");
  const y = JSON.parse(JSON.stringify(x)); x.dur = +off.toFixed(2); y.start = +now.toFixed(2); y.dur = +(y.dur - off).toFixed(2);
  if (k === "broll") y.in = +(x.in + off).toFixed(2);
  tl[k].splice(i + 1, 0, y);
}
// SRT: "00:00:01,500 --> 00:00:03,000" + các dòng chữ
function parseSrt(s) {
  const out = [], ts = t => { const m = t.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/); return m ? +m[1] * 3600 + +m[2] * 60 + +m[3] + +m[4] / 1000 : NaN; };
  for (const b of s.replace(/\r/g, "").split(/\n\s*\n/)) {
    const ls = b.trim().split("\n"), j = ls.findIndex(l => l.includes("-->")); if (j < 0) continue;
    const [a, z] = ls[j].split("-->").map(ts), text = ls.slice(j + 1).join(" ").trim();
    if (text && a >= 0 && z > a) out.push({start: +a.toFixed(2), dur: +(z - a).toFixed(2), text});
  }
  return out;
}
function importSrt(s) {
  const L = layout(), xs = parseSrt(s).filter(x => x.start < L.total);
  if (!xs.length) return toast("Không đọc được dòng phụ đề nào trong SRT", "err");
  mutate(() => tl.subtitles.push(...xs)); toast(`Đã thêm ${xs.length} phụ đề.`, "ok");
}

// Timeline: bấm/kéo trên thước để tua; kéo mục để dời; kéo mép phải để đổi độ dài
$("#track").addEventListener("pointerdown", e => {
  const pps = +$("#zoom").value, r = $("#track").getBoundingClientRect();
  if (e.target.closest("#ruler")) {
    seek((e.clientX - r.left) / pps);
    const mv = ev => seek((ev.clientX - r.left) / pps);
    addEventListener("pointermove", mv); addEventListener("pointerup", () => removeEventListener("pointermove", mv), {once: true}); return;
  }
  const el = e.target.closest(".x[data-k]"); if (!el) return;
  sel = {k: el.dataset.k, i: +el.dataset.i};
  const k = sel.k, x = tl[k][sel.i];
  if (!TIMED.includes(k)) { if (k === "clips") seek((e.clientX - r.left) / pps); return draw(); }
  const rz = e.target.classList.contains("rz"), x0 = e.clientX, s0 = x.start, d0 = x.dur; let moved = false;
  const mv = ev => {
    const dx = (ev.clientX - x0) / pps; if (Math.abs(ev.clientX - x0) > 3) moved = true; if (!moved) return;
    if (rz) el.style.width = Math.max(0.2, d0 + dx) * pps + "px"; else el.style.left = Math.max(0, s0 + dx) * pps + "px";
  };
  addEventListener("pointermove", mv);
  addEventListener("pointerup", ev => {
    removeEventListener("pointermove", mv);
    const dx = Math.round((ev.clientX - x0) / pps * 10) / 10;
    if (moved && dx) mutate(() => { if (rz) x.dur = Math.max(0.2, d0 + dx); else x.start = Math.max(0, s0 + dx); });
    else { now = x.start + 0.05; draw(); }
  }, {once: true});
});
document.addEventListener("keydown", e => {
  const ctl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (ctl && k === "s") { e.preventDefault(); return save(); }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || $("#dlg").open) return;
  if (k === " ") { e.preventDefault(); $("#play").click(); }
  else if (e.key === "ArrowLeft") seek(now - (e.shiftKey ? 1 : 1 / FPS));
  else if (e.key === "ArrowRight") seek(now + (e.shiftKey ? 1 : 1 / FPS));
  else if (ctl && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (ctl && k === "y") { e.preventDefault(); redo(); }
  else if (e.key === "Delete" || e.key === "Backspace") action("del");
  else if (k === "s" && !ctl) $("#split").click();
});

// Xem thử chuyển cảnh gl-transitions ngay trong trình duyệt, trên ảnh của 2 đoạn kề nhau
let GL = null, glr = null, glName = null, glRaf = 0, glImgs = null;
async function glLoad() {
  if (!window.glT) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "/gl_runtime.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  GL ??= await api("gl");
}
function glPreview(type) {
  cancelAnimationFrame(glRaf); glName = type;
  const info = $("#trinfo"), cv = $("#trc"); if (!info) return;
  const i = sel && sel.k === "transitions" ? sel.i : 0, A = tl.clips[i], B = tl.clips[Math.min(i + 1, tl.clips.length - 1)];
  info.innerHTML = `<b>${esc(type)}</b><div class="dim">${esc(FX.transitions[type].vi)}</div>`
    + (sel && sel.k === "transitions" ? `<div class="row"><button class="lime" data-apply="${esc(type)}">Áp dụng cho chuyển cảnh ${i + 1} → ${i + 2}</button></div>` : `<div class="dim" style="margin-top:8px">Chọn một chuyển cảnh trên timeline để áp dụng.</div>`);
  if (!type.startsWith("gl-")) { cv.getContext("webgl")?.clear?.(0); return info.insertAdjacentHTML("beforeend", `<div class="dim">Kiểu này xem bằng “Dựng nháp”.</div>`); }
  const load = src => new Promise(ok => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; });
  Promise.all([load(media("thumb", A.file + "@" + (+A.in + Math.max(0.3, A.dur - 0.3)).toFixed(1))), load(media("thumb", B.file + "@" + (+B.in + 0.3).toFixed(1)))]).then(([a, b]) => {
    if (glName !== type) return;  // người dùng đã chọn hiệu ứng khác trong lúc chờ ảnh
    if (!a || !b) return info.insertAdjacentHTML("beforeend", `<div class="dim">Chưa có ảnh cảnh (chưa có footage trên máy).</div>`);
    glr ??= glT(cv, GL); const t0 = performance.now(), name = type.slice(3);
    const tick = now => { const k = ((now - t0) / 1600) % 1; glr.draw(name, a, b, Math.min(1, k / 0.75)); glRaf = requestAnimationFrame(tick); };
    glRaf = requestAnimationFrame(tick);
  });
}
