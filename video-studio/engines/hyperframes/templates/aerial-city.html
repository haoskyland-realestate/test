<!doctype html>
<html lang="vi" data-resolution="__RES__">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<script src="gsap.min.js"></script>
<script src="three.global.js"></script>
<style>
  * { margin:0; padding:0; }
  html, body { width:__W__px; height:__H__px; overflow:hidden; background:#10202e; }
  #gl { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
  <canvas id="gl" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0"></canvas>
</div>
<script>
// Cảnh bay trên thành phố giả lập (cảnh thế chỗ cho flycam khi chưa có footage thật). Camera chạy theo timeline nên render lặp lại được.
const DUR = __DUR__, W = __W__, H = __H__;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true });
renderer.setSize(W, H, false);
const scene = new THREE.Scene();
const sky = 0xf2b98a;
scene.background = new THREE.Color(sky);
scene.fog = new THREE.Fog(sky, 25, 95);
const cam = new THREE.PerspectiveCamera(60, W / H, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffe7c8, 0x2b3a4a, 1.1));
const sun = new THREE.DirectionalLight(0xffd9a8, 2.2); sun.position.set(-30, 25, 10); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x2e4a3a }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const tones = [0xe8e2d6, 0xcfd8dc, 0xb0bec5, 0xf5f0e6, 0x90a4ae];
for (let gx = -60; gx <= 60; gx += 6) for (let gz = -100; gz <= 60; gz += 6) {
  if (Math.abs(gx) < 4 && rnd() < 0.7) continue; // vài khoảng trống như đường/công viên
  const h = 2 + rnd() * rnd() * 16;
  const b = new THREE.Mesh(new THREE.BoxGeometry(3 + rnd() * 2, h, 3 + rnd() * 2),
    new THREE.MeshStandardMaterial({ color: tones[(rnd() * tones.length) | 0] }));
  b.position.set(gx + rnd() * 1.5, h / 2, gz + rnd() * 1.5); scene.add(b);
}
const state = { t: 0 };
const draw = () => {
  const t = state.t;
  cam.position.set(4 * Math.sin(t * 0.18), 13 + 2 * Math.sin(t * 0.31), 45 - t * 2.3);
  cam.lookAt(2 * Math.sin(t * 0.18 + 0.6), 6, cam.position.z - 25);
  renderer.render(scene, cam);
};
const tl = gsap.timeline({ paused: true });
tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
window.__timelines["main"] = tl;
draw();
tl.seek(0);
</script>
</body>
</html>
